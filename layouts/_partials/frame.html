<!-- args: img (resource), alt, caption, loading -->
{{- $img := .img -}}
{{- $ar := partial "ar-class.html" $img -}}
<figure class="">
    <div class="frame {{ $ar }} cv">
        <img src="{{ $img.RelPermalink }}" alt="{{ .alt }}" loading="{{ .loading | default "lazy" }}" decoding="async"> 
    </div>
  {{- with .caption }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
