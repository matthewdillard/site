{{ define "main" }}
    <article class="grid-wrap">
        {{ partial "header.html" . }}
        <div class="spacer__sm"></div>
        <div class="grid-wrap__text">
            {{$breadcrumb := split .Path "/"}}
            <h1><span class="subtle p-a-0">{{index $breadcrumb 1}}/</span>{{index $breadcrumb 2}}</h1>
            <div class="spacer__sm"></div>
            {{ .Content }}
            <div class="article-list project-list">
            {{ range where .Pages "Type" "projects" }}
                {{ partial "project-item.html" . }}
            {{ end }}
            </div>
        </div>
        {{ partial "grid-paper.html" . }}
    </article>
{{ end }}
