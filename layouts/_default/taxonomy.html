{{ define "main" }}
    <article class="grid-wrap">
        {{ partial "header.html" . }}
        <div class="spacer__sm"></div>
        <div class="grid-wrap__text">
            <h1>{{ .Title }}</h1>
            {{ .Content }}
            {{ range .Pages }}
                <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
            {{ end }}
        </div>
        {{ partial "grid-paper.html" . }}
    </article>
{{ end }}
